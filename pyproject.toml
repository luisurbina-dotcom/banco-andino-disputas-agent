[project]
name = "banco-andino-disputas"
version = "0.1.0"
description = "Agente de disputas y contracargos para Banco Andino (ficticio)"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["src", ".claude/hooks"]
markers = ["e2e: casos end-to-end que llaman al modelo (requieren ANTHROPIC_API_KEY)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
