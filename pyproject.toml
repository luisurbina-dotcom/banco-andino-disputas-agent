[project]
name = "banco-andino-disputas"
version = "0.1.0"
description = "Agente de disputas y contracargos para Banco Andino (ficticio)"
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2,<0.3",
    "fastmcp>=4,<5",
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server", "src/agent", "src/chat"]
exclude = ["src/*/test_*.py", "src/*/conftest.py", "src/*/CLAUDE.md"]

[dependency-groups]
dev = [
    "anyio>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["src", ".claude/hooks"]
markers = ["e2e: casos end-to-end que llaman al modelo (requieren ANTHROPIC_API_KEY)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Los hooks corren con el python3 del sistema (3.10+): sin reescrituras a sintaxis 3.12.
".claude/hooks/*.py" = ["UP"]
